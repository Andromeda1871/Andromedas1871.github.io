<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout 3 Kotak</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }

        /* Wadah utama */
        .container {
            width: 600px;
            height: 400px;

            display: grid;

            /* Kolom kiri 2x lebih besar daripada kanan */
            grid-template-columns: 2fr 1fr;

            /* 2 baris dengan tinggi sama */
            grid-template-rows: 1fr 1fr;

            border: 2px solid black;
        }

        /* Kotak 1 */
        .kotak1 {
            grid-column: 1 / 4;
            grid-row: 1;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #ff0000;
            border-bottom: 2px solid black;
        }

        /* Kotak 2 */
        .kotak2 {
            grid-column: 1;
            grid-row: 2;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #00ff6c;
            border-right: 2px solid black;
        }

        /* Kotak 3 */
        .kotak3 {
            grid-column: 2;
            grid-row: 2;

            display: flex;
            justify-content:left;
            align-items: top;

            background-color: #fff200;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="kotak1">
           <h1>Website Andro</h1> 
            <link rel="stylesheet"
       href="styles.css">
            <img src="smk.png" width="100px">
        </div>

        <div class="kotak2">
            <h2>Profil : Saya seorang siswa<br><span>dari SMKN 1</span><br><span>Kota Tangerang</span></h2>
    
            <link rel="stylesheet"
       href="styles.css">
        </div>

        <div class="kotak3">
        <h3>Data Diri :<br><span>Nama :</span><br><span>Andro</span>
               <br><span>Hobi :</span><br><span>Menggambar</span>
            <br><span>Umur :</span><br><span>18 Tahun</span>
        </h3>
    
            
            <link rel="stylesheet"
       href="styles.css">
            <img src="FOTO%20BG%20MERAH.png" width=75px height="75px"
                 padding : 50 px>
        </div>


    </div>
    
</body>
     
</html>
